<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloodServe - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <h1>BloodServe</h1>
    <nav>
      <a href="/learn">Learn</a>
      <a href="/mission">Our Mission</a>
      <a href="/register">Register</a>
    </nav>
  </header>

  <div class="hero">
    <h2>Save a Life Today</h2>
    <p>Login to donate blood or request blood for someone in need.</p>
  </div>

  <main class="form-container">
    <h2>Welcome Back 👋</h2>
    <form id="loginForm">
      <label style="color:#c62828;font-weight:600;font-size:0.9rem;">
        Email Address *
      </label>
      <input
        type="email"
        name="email"
        placeholder="📧 Enter your email"
        required
      >
      <label style="color:#c62828;font-weight:600;font-size:0.9rem;">
        Password *
      </label>
      <input
        type="password"
        name="password"
        placeholder="🔒 Enter your password"
        required
      >
      <button type="submit" class="btn">
        🔑 Login
      </button>
    </form>
    <p>Don't have an account? <a href="/register">Register Now</a></p>
  </main>

  <footer class="footer">
    <p>&copy; 2026 BloodServe | Powered by Aislyn Technologies</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
