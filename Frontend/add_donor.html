<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloodServe - Add Donor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <h1>BloodServe</h1>
    <nav>
      <a href="/admin-page">Dashboard</a>
      <a href="/admin-page">👥 Donors</a>
      <a href="/request">📋 Requests</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <div class="hero">
    <h2>Add New Donor</h2>
    <p>Fill in the details below to register a new blood donor.</p>
  </div>

  <main class="form-container">
    <h2>Donor Registration</h2>

    <form id="addDonorForm">

      <!-- Full Name -->
      <label style="color:#c62828;font-weight:600;font-size:0.9rem;">
        Full Name *
      </label>
      <input
        type="text"
        name="name"
        placeholder="Enter full name"
        required
      >

      <!-- Email -->
      <label style="color:#c62828;font-weight:600;font-size:0.9rem;">
        Email Address
      </label>
      <input
        type="email"
        name="email"
        placeholder="Enter email address"
      >

      <!-- Gender -->
      <label style="color:#c62828;font-weight:600;font-size:0.9rem;">
        Gender
      </label>
      <select name="gender">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <!-- Phone -->
      <label style="color:#c62828;font-weight:600;font-size:0.9rem;">
        Phone Number
      </label>
      <input
        type="tel"
        name="phone"
        placeholder="Enter phone number"
      >

      <!-- Age -->
      <label style="color:#c62828;font-weight:600;font-size:0.9rem;">
        Age
      </label>
      <input
        type="number"
        name="age"
        placeholder="Enter age (18-65)"
        min="18"
        max="65"
      >

      <!-- Blood Group -->
      <label style="color:#c62828;font-weight:600;font-size:0.9rem;">
        Blood Group *
      </label>
      <select name="bloodGroup" required>
        <option value="">Select Blood Group</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>AB+</option>
        <option>AB-</option>
        <option>O+</option>
        <option>O-</option>
      </select>

      <!-- Address -->
      <label style="color:#c62828;font-weight:600;font-size:0.9rem;">
        Address / City
      </label>
      <input
        type="text"
        name="address"
        placeholder="Enter address or city"
      >

      <!-- Last Donation Date -->
      <label style="color:#c62828;font-weight:600;font-size:0.9rem;">
        Last Donation Date
      </label>
      <input
        type="date"
        name="lastDonationDate"
      >

      <!-- Medical Conditions -->
      <label style="color:#c62828;font-weight:600;font-size:0.9rem;">
        Any Medical Conditions
      </label>
      <textarea
        name="medicalConditions"
        placeholder="Enter any medical conditions (optional)"
        rows="3"
      ></textarea>

      <button type="submit" class="btn">
        🩸 Register Donor
      </button>

      <a href="/admin-page" class="btn btn-secondary"
        style="display:block;text-align:center;margin-top:0.5rem;">
        ← Back to Donors
      </a>

    </form>
  </main>

  <footer class="footer">
    <p>&copy; 2026 BloodServe | Powered by Aislyn Technologies</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
